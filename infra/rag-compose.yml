# infra/rag-compose.yml
# Qdrant (vector store) and Neo4j (graph projection) for Pragyan RAG Copilot.
# Ollama runs NATIVELY on the Windows host — do NOT add it here.
#
# Startup:
#   docker compose -f infra/rag-compose.yml up -d
#   docker compose -f infra/rag-compose.yml ps   # confirm healthy
#   docker compose -f infra/rag-compose.yml down  # stop (volumes are preserved)
#
# Volumes are persistent named Docker volumes.
# Neo4j password is sourced from the NEO4J_PASSWORD environment variable.
# Never commit credentials — copy .env.example -> .env and fill in secrets.

services:
  qdrant:
    image: ${QDRANT_IMAGE:-qdrant/qdrant:v1.10.1}
    container_name: pragyan-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST + gRPC
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/readyz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5.20}
    container_name: pragyan-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-local_secret_only}
      NEO4J_server_memory_heap_initial__size: "256m"
      NEO4J_server_memory_heap_max__size: "512m"
      NEO4J_server_memory_pagecache_size: "128m"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  qdrant_storage:
    name: pragyan_qdrant_storage
  neo4j_data:
    name: pragyan_neo4j_data
  neo4j_logs:
    name: pragyan_neo4j_logs
